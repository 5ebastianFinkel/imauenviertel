[build]
  command = "pnpm build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

# Remote hosts the Image CDN may fetch from (/.netlify/images). Keep in sync
# with REMOTE_IMAGE_HOSTS in src/utils/images.ts.
[images]
  remote_images = ['https://images\.unsplash\.com/.*', 'https://res\.cloudinary\.com/.*']

# Headers for the admin section
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

# Redirect rules
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# Enable Git Gateway
[context.production]
  [context.production.environment]
    GIT_LFS_ENABLED = "true"