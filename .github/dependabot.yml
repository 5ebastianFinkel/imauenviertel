version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"
    groups:
      # Patch and minor updates arrive together in one weekly PR
      minor-and-patch-updates:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Europe/Berlin"
    commit-message:
      prefix: "chore(ci):"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
